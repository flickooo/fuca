<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Teletext-style favicon: black screen, blue double-height band with blocky yellow "FT", Fastext colour keys -->
  <rect width="16" height="16" fill="#000"/>
  <rect y="1" width="16" height="10" fill="#00f"/>
  <!-- F -->
  <rect x="2" y="3" width="2" height="7" fill="#ff0"/>
  <rect x="2" y="3" width="5" height="2" fill="#ff0"/>
  <rect x="2" y="6" width="4" height="1" fill="#ff0"/>
  <!-- T -->
  <rect x="8" y="3" width="6" height="2" fill="#ff0"/>
  <rect x="10" y="3" width="2" height="7" fill="#ff0"/>
  <!-- Fastext keys -->
  <rect y="12" width="4" height="4" fill="#f00"/>
  <rect x="4" y="12" width="4" height="4" fill="#0f0"/>
  <rect x="8" y="12" width="4" height="4" fill="#ff0"/>
  <rect x="12" y="12" width="4" height="4" fill="#0ff"/>
</svg>
